services:
  news-hub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_NEWSAPI_KEY: ${VITE_NEWSAPI_KEY}
        VITE_GUARDIAN_KEY: ${VITE_GUARDIAN_KEY}
        VITE_NYT_KEY: ${VITE_NYT_KEY}
    image: news-hub:latest
    container_name: news-hub
    ports:
      - "8080:80"
    restart: unless-stopped

